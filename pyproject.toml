[project]
name = "mlops-sample"
version = "0.2.1"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.4",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["api/tests"]
addopts = "-ra"
